[tools]
go = "1.25"
golangci-lint = "latest"

# Every task's `run` below is a single process invocation, never a shell
# script. mise hands inline `run` strings to cmd.exe on Windows and to a POSIX
# shell everywhere else, so anything relying on $(...), [ ... ], ||, a pipe, or
# a coreutil such as mkdir -p works on one platform and silently breaks on the
# other. Launching one process is the one thing every shell does identically.
#
# When a task needs more than that:
#   - a computed value      -> a mise template, evaluated by mise, not a shell
#   - logic or file work    -> Go, reached with `go run .`
#   - a pass/fail check     -> the tool's own flag, not shell exit-code glue

[tasks.build]
description = "Build the nm binary into bin/"
# -o bin/ rather than -o bin/nm: Go then names the output nm on Unix and
# nm.exe on Windows, where an extensionless file is not executable.
run = "go build -o bin/ ."

[tasks.run]
description = "Run nm from source (mise run run -- worktree new repo name)"
run = "go run . {{arg(name='args', var=true, default='')}}"

[tasks.test]
description = "Run all tests"
run = "go test ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

# format and format:check are the same engine (.golangci.yml enables gofumpt
# under `formatters`), so the two can never disagree about what is formatted.
[tasks.format]
description = "Format all Go source with gofumpt"
run = "golangci-lint fmt"

[tasks."format:check"]
description = "Fail if any Go source is unformatted"
run = "golangci-lint fmt --diff"

[tasks.install]
description = "Build nm and install it into install_dir from ~/.nm.json"
depends = ["build"]
# `nm self install` reads install_dir from ~/.nm.json and copies the binary
# built above. Go does the work that mkdir -p and install -m used to.
run = "go run . self install"

[tasks.setup-shell]
description = "Append the nm shell integration to your shell rc file (idempotent)"
run = "go run . shell setup"

[tasks.hooks]
description = "Install the git pre-commit hook that runs the pre-commit gate"
run = "mise generate git-pre-commit --task=pre-commit --write"

[tasks.pre-commit]
description = "Verification gate: format check, lint, build, test"
depends = ["format:check", "lint", "build", "test"]

[tasks.ci]
description = "What CI runs (same gate as pre-commit)"
depends = ["format:check", "lint", "build", "test"]
